<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КЛЁВый Прогноз</title>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: "Times New Roman", serif;
  }

  body {
    background: linear-gradient(180deg, #5b9dd8 0%, #4a7fd4 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Шапка ---------- */
  header {
    height: 150px;
    background: linear-gradient(180deg, #8fa8bd 0%, #7d97b3 100%);
    position: relative;
    flex-shrink: 0;
  }

  .header-inner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
  }

  .cloud {
    position: relative;
    width: 130px;
    height: 60px;
    background: #fdfdfd;
    border-radius: 60px;
    filter: drop-shadow(0 2px 2px rgba(60,80,100,.35));
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #fdfdfd;
    border-radius: 50%;
  }
  .cloud::before {
    width: 62px; height: 62px;
    top: -30px; left: 20px;
  }
  .cloud::after {
    width: 46px; height: 46px;
    top: -20px; right: 22px;
  }

  h1 {
    font-family: "Marck Script", cursive;
    font-size: 64px;
    color: #eef3f6;
    text-shadow: 2px 2px 0 rgba(70,90,110,.55), 0 0 8px rgba(50,70,90,.25);
    white-space: nowrap;
    letter-spacing: 2px;
  }

  /* ---------- Центр ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }

  .label {
    font-size: 30px;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(40,60,90,.35);
  }

  .search-box {
    display: flex;
    background: rgba(23,64,124,.85);
    border-radius: 40px;
    padding: 6px;
    width: 560px;
    max-width: 90vw;
  }

  #region-input {
    flex: 1;
    border: none;
    outline: none;
    background: #ffffff;
    border-radius: 30px;
    font-size: 22px;
    padding: 12px 24px;
    color: #2a3f5f;
    font-family: inherit;
  }
  #region-input::placeholder { color: #b8c4d4; }

  #search-btn {
    width: 78px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #search-btn svg {
    width: 38px;
    height: 38px;
    stroke: #cfe0f2;
    fill: none;
    stroke-width: 2.6;
    stroke-linecap: round;
    transition: stroke .15s;
  }
  #search-btn:hover svg { stroke: #ffffff; }

  #result {
    font-size: 28px;
    color: #ffffff;
    min-height: 40px;
    text-shadow: 0 1px 3px rgba(40,60,90,.4);
  }

  /* ---------- Шестерёнка ---------- */
  .gear {
    position: fixed;
    right: 22px;
    bottom: 18px;
    width: 62px;
    height: 62px;
    cursor: pointer;
    opacity: .85;
  }
  .gear:hover { opacity: 1; }
  .gear svg {
    width: 100%;
    height: 100%;
    fill: #2d4a7a;
    filter: drop-shadow(0 2px 3px rgba(20,40,70,.4));
  }
</style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="cloud"></div>
      <h1>КЛЁВый Прогноз</h1>
      <div class="cloud"></div>
    </div>
  </header>

  <main>
    <div class="label">Выберите регион:</div>

    <form class="search-box" id="search-form">
      <input type="text" id="region-input" autocomplete="off">
      <button type="submit" id="search-btn" aria-label="Найти">
        <svg viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <line x1="15.5" y1="15.5" x2="21" y2="21"/>
        </svg>
      </button>
    </form>

    <div id="result"></div>
  </main>

  <div class="gear" title="Настройки">
    <svg viewBox="0 0 24 24">
      <path d="M19.4 13c.04-.32.06-.65.06-1s-.02-.68-.06-1l2.1-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.3 7.3 0 0 0-1.73-1l-.38-2.65A.5.5 0 0 0 13.93 2h-4a.5.5 0 0 0-.49.42l-.38 2.65c-.63.26-1.2.6-1.73 1l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64L4.6 11c-.04.32-.06.65-.06 1s.02.68.06 1l-2.1 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.31.6.22l2.49-1c.53.4 1.1.74 1.73 1l.38 2.65c.04.24.25.42.49.42h4c.24 0 .45-.18.49-.42l.38-2.65c.63-.26 1.2-.6 1.73-1l2.49 1c.21.09.47 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
    </svg>
  </div>

<script>
  const form = document.getElementById("search-form");
  const input = document.getElementById("region-input");
  const result = document.getElementById("result");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const query = input.value.trim();
    if (query === "") return;
    result.textContent = "Не найдено";
  });
</script>

</body>
</html>
