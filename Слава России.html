<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Пример с кнопкой и картинкой</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f0f2f5;
      margin: 0;
    }

    /* Стили для картинки */
    .hero-image {
      max-width: 100%;       /* Чтобы не вылезала за экран на телефоне */
      width: 400px;          /* Фиксированная ширина на больших экранах */
      height: auto;          /* Высота подстроится сама, пропорции не исказятся */
      border-radius: 16px;   /* Скруглённые углы */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); /* Тень для объёма */
      margin-bottom: 30px;
    }

    /* Стили для кнопки */
    .btn {
      padding: 15px 35px;
      background-color: #ff5e5e; /* Яркий красный цвет */
      color: white;
      border: none;
      border-radius: 50px;       /* Сильно скруглённые края */
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.3s;
      box-shadow: 0 4px 10px rgba(255, 94, 94, 0.4);
    }

    .btn:hover {
      background-color: #d63f3f; /* Цвет при наведении */
      transform: scale(1.05);    /* Кнопка чуть увеличивается */
    }

    .btn:active {
      transform: scale(0.95);    /* Кнопка слегка вдавливается */
    }

    /* Место для текста "Привет" */
    #result-text {
      margin-top: 20px;
      font-size: 24px;
      font-weight: 600;
      color: #333;
      opacity: 0;                /* Скрыт по умолчанию */
      transform: translateY(10px);
      transition: all 0.4s ease;
    }

    #result-text.show {
      opacity: 1;                /* Появляется плавно */
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Картинка из интернета -->
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXKvZmYFCz0kJWPJy_a9i_fNybl9f-NdFOg8fWKwLejQ&s=10" 
       alt="Путин э" 
       class="hero-image">

  <!-- Кнопка -->
  <button class="btn" id="myButton">Нажми меня!</button>

  <!-- Сюда будет выводиться текст -->
  <p id="result-text">Привет</p>

  <script>
    // 1. Находим кнопку и текст на странице
    const button = document.getElementById('myButton');
    const textElement = document.getElementById('result-text');

    // 2. Вешаем событие: когда нажали на кнопку
    button.addEventListener('click', function() {
      // Добавляем класс .show, чтобы текст плавно появился
      textElement.classList.add('show');
      
      // Если хочешь, чтобы при повторном нажатии текст исчезал:
      // textElement.classList.toggle('show'); 
    });
  </script>
</body>
</html>
