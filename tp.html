<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КЛЁВый Прогноз</title>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">

<!-- Leaflet (карта) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- model-viewer (3D-модели) -->
<script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; font-family: "Times New Roman", serif; }

  body {
    background: linear-gradient(180deg, #5b9dd8 0%, #4a7fd4 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Шапка ---------- */
  header {
    height: 150px;
    background: linear-gradient(180deg, #8fa8bd 0%, #7d97b3 100%);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
  }

  .cloud {
    position: relative;
    width: 130px; height: 60px;
    background: #fdfdfd;
    border-radius: 60px;
    filter: drop-shadow(0 2px 2px rgba(60,80,100,.35));
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #fdfdfd;
    border-radius: 50%;
  }
  .cloud::before { width: 62px; height: 62px; top: -30px; left: 20px; }
  .cloud::after  { width: 46px; height: 46px; top: -20px; right: 22px; }

  h1 {
    font-family: "Marck Script", cursive;
    font-size: 64px;
    color: #eef3f6;
    text-shadow: 2px 2px 0 rgba(70,90,110,.55), 0 0 8px rgba(50,70,90,.25);
    white-space: nowrap;
    letter-spacing: 2px;
  }

  /* ---------- Экраны ---------- */
  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 20px;
    min-height: 0;
  }
  .screen.hidden { display: none; }

  /* ---------- Главная ---------- */
  .label {
    font-size: 30px;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(40,60,90,.35);
  }

  .search-box {
    display: flex;
    background: rgba(23,64,124,.85);
    border-radius: 40px;
    padding: 6px;
    width: 560px;
    max-width: 90vw;
  }

  #region-input {
    flex: 1;
    border: none;
    outline: none;
    background: #ffffff;
    border-radius: 30px;
    font-size: 22px;
    padding: 12px 24px;
    color: #2a3f5f;
    font-family: inherit;
  }
  #region-input::placeholder { color: #b8c4d4; }

  #search-btn {
    width: 78px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #search-btn svg {
    width: 38px; height: 38px;
    stroke: #cfe0f2; fill: none;
    stroke-width: 2.6; stroke-linecap: round;
    transition: stroke .15s;
  }
  #search-btn:hover svg { stroke: #ffffff; }

  #result { font-size: 24px; color: #ffffff; min-height: 36px; text-align: center; }

  /* ---------- Экран региона ---------- */
  #back-btn {
    align-self: flex-start;
    margin-left: 25px;
    border: none;
    background: rgba(23,64,124,.85);
    color: #ffffff;
    font-family: inherit;
    font-size: 18px;
    padding: 8px 20px;
    border-radius: 30px;
    cursor: pointer;
  }
  #back-btn:hover { background: rgba(40,90,160,.9); }

  .map-layout {
    display: flex;
    gap: 16px;
    width: min(1200px, 95vw);
    flex: 1;
    min-height: 0;
  }

  #map {
    flex: 2;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(20,40,70,.35);
    background: #a8c6e0;
  }

  /* ---------- Панель рыб ---------- */
  #fish-panel {
    flex: 1;
    background: rgba(255,255,255,.92);
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(20,40,70,.35);
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #fish-panel.hidden { display: none; }

  #pond-name {
    font-size: 26px;
    color: #2a3f5f;
    text-align: center;
  }

  .fish-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #eef3fa;
    border-radius: 14px;
    padding: 10px 14px;
  }

  .fish-card model-viewer {
    width: 120px; height: 120px;
    flex-shrink: 0;
  }

  .fish-info { display: flex; flex-direction: column; gap: 8px; }
  .fish-name { font-size: 22px; color: #2a3f5f; font-weight: bold; }

  .forecast-scale {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .cell {
    width: 22px; height: 12px;
    border-radius: 6px;
    background: #d7dfe8;
  }
  .cell.on-1 { background: #e5484d; }
  .cell.on-2 { background: #f5a623; }
  .cell.on-3 { background: #f2c94c; }
  .cell.on-4 { background: #7cc24f; }
  .cell.on-5 { background: #2fa84f; }

  .forecast-text { font-size: 15px; color: #4a607a; }

  .panel-placeholder {
    color: #5b7290;
    font-size: 18px;
    text-align: center;
    margin: auto 0;
  }

  /* ---------- Шестерёнка ---------- */
  .gear {
    position: fixed;
    right: 22px; bottom: 18px;
    width: 62px; height: 62px;
    cursor: pointer;
    opacity: .85;
    z-index: 10;
  }
  .gear:hover { opacity: 1; }
  .gear svg {
    width: 100%; height: 100%;
    fill: #2d4a7a;
    filter: drop-shadow(0 2px 3px rgba(20,40,70,.4));
  }
</style>
</head>

<body>

  <header>
    <div class="cloud"></div>
    <h1>КЛЁВый Прогноз</h1>
    <div class="cloud"></div>
  </header>

  <!-- Главный экран -->
  <section class="screen" id="screen-main">
    <div class="label">Выберите регион:</div>

    <form class="search-box" id="search-form">
      <input type="text" id="region-input" placeholder="Например: Кемеровская область" autocomplete="off">
      <button type="submit" id="search-btn" aria-label="Найти">
        <svg viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <line x1="15.5" y1="15.5" x2="21" y2="21"/>
        </svg>
      </button>
    </form>

    <div id="result"></div>
  </section>

  <!-- Экран региона -->
  <section class="screen hidden" id="screen-region">
    <button id="back-btn">← Назад</button>

    <div class="map-layout">
      <div id="map"></div>

      <aside id="fish-panel" class="hidden">
        <h2 id="pond-name"></h2>
        <div id="fish-list"></div>
      </aside>

      <aside id="panel-placeholder-hint" class="panel-placeholder">
        Нажмите на метку водоёма,<br>чтобы увидеть рыб и прогноз клёва
      </aside>
    </div>

  </section>

  <div class="gear" title="Настройки">
    <svg viewBox="0 0 24 24">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
    </svg>
  </div>

<script>
/* ============================================================
   СПРАВОЧНИК ВОДОЁМОВ
   Здесь задаём координаты меток и рыб.
   В поле model — путь к вашему .glb файлу с 3D-моделью рыбы.
   Папку models/ положите рядом с этим html-файлом.
   ============================================================ */
const PONDS = [
  {
    id: "berchikul",
    name: "Озеро Большой Берчикуль",
    type: "озеро",
    coords: [55.611, 88.344],
    fish: [
      { name: "Окунь",  model: "models/perch.glb" },
      { name: "Карась", model: "models/crucian.glb" },
      { name: "Щука",   model: "models/pike.glb" }
    ]
  },
  {
    id: "belovskoe",
    name: "Беловское водохранилище",
    type: "водохранилище",
    coords: [54.411, 86.511],
    fish: [
      { name: "Лещ",   model: "models/leech.glb" },
      { name: "Судак", model: "models/zander.glb" },
      { name: "Плотва", model: "models/roach.glb" }
    ]
  },
  {
    id: "tom",
    name: "Река Томь (у Кемерова)",
    type: "река",
    coords: [54.99, 86.00],   // координата примерная — уточните, где будет метка
    fish: [
      { name: "Щука",   model: "models/pike.glb" },
      { name: "Хариус", model: "models/grayling.glb" },
      { name: "Налим",  model: "models/burbot.glb" }
    ]
  }
  /* Добавляйте водоёмы сюда же — карта и панель подхватят их автоматически.
     Пока координаты и списки рыб — тестовые, замените реальными данными. */
];

/* ============================================================
   ПРОГНОЗ КЛЁВА
   Точка интеграции для коллеги, который делает логику.
   Сейчас — заглушка (случайное значение, стабильно для одной рыбы).
   Позже здесь будет формула с погодой, давлением, сезоном и т.д.
   Функция обязана возвращать целое число от 1 до 5.
   ============================================================ */
function computeForecast(pond, fish) {
  // Простая стабильная заглушка: псевдослучайное значение 1–5
  const seed = [...pond.id, ...fish.name].reduce((s, ch) => s + ch.charCodeAt(0), 0);
  return 1 + (seed % 5);
}

/* ============================================================
   ДАЛЕЕ — ЛОГИКА ПРИЛОЖЕНИЯ. Менять обычно не нужно.
   ============================================================ */

const form = document.getElementById("search-form");
const input = document.getElementById("region-input");
const result = document.getElementById("result");

const screenMain = document.getElementById("screen-main");
const screenRegion = document.getElementById("screen-region");
const backBtn = document.getElementById("back-btn");

const fishPanel = document.getElementById("fish-panel");
const pondName = document.getElementById("pond-name");
const fishList = document.getElementById("fish-list");
const panelHint = document.getElementById("panel-placeholder-hint");

let map = null;

/* --- Переход на экран региона --- */
form.addEventListener("submit", function (e) {
  e.preventDefault();
  const query = input.value.trim();
  if (query === "") {
    result.textContent = "Введите название региона";
    return;
  }

  // Пока регион принимаем любой текст.
  // Позже: сверка со списком регионов, у каждого — свои PONDS.
  result.textContent = "";
  screenMain.classList.add("hidden");
  screenRegion.classList.remove("hidden");

  initMap();
});


/* --- Возврат на главную --- */
backBtn.addEventListener("click", function () {
  screenRegion.classList.add("hidden");
  screenMain.classList.remove("hidden");
  input.value = "";
  result.textContent = "";
  if (map) {
    map.remove();
    map = null;
  }
  fishPanel.classList.add("hidden");
  panelHint.classList.remove("hidden");
});

/* --- Карта --- */
function initMap() {

  if (map) return; // карта уже создана

  map = L.map("map").setView([54.75, 87.2], 7); // центр Кузбасса

  L.tileLayer("https://a.tile.opentopomap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap, © OpenTopoMap",
    maxZoom: 17
  }).addTo(map);


  PONDS.forEach(function (pond) {
    L.marker(pond.coords, { title: pond.name })
      .addTo(map)
      .bindPopup(pond.name)
      .on("click", function () { showPond(pond); });
  });


  // На случай изменения размеров окна
  setTimeout(function () { map.invalidateSize(); }, 100);
}

/* --- Панель с рыбами --- */
function showPond(pond) {
  pondName.textContent = pond.name + " (" + pond.type + ")";

  fishList.innerHTML = pond.fish.map(function (fish) {
    const score = computeForecast(pond, fish);
    const scale = Array.from({ length: 5 }, (_, i) =>
      `<div class="cell${i < score ? " on-" + score : ""}"></div>`

    ).join("");

    return `
      <div class="fish-card">
        <model-viewer src="${fish.model}" alt="${fish.name}"
                      camera-controls auto-rotate
                      shadow-intensity="1"></model-viewer>
        <div class="fish-info">
          <div class="fish-name">${fish.name}</div>
          <div class="forecast-scale">${scale}</div>
          <div class="forecast-text">Прогноз клёва: ${score} из 5</div>

        </div>
      </div>`;
  }).join("");

  panelHint.classList.add("hidden");
  fishPanel.classList.remove("hidden");
}
</script>

</body>
</html>
