<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КЛЁВый Прогноз</title>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: "Times New Roman", serif;
  }

  body {
    background: linear-gradient(180deg, #5b9dd8 0%, #4a7fd4 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Шапка ---------- */
  header {
    height: 150px;
    background: linear-gradient(180deg, #8fa8bd 0%, #7d97b3 100%);
    position: relative;
    flex-shrink: 0;
  }

  .header-inner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
  }

  .cloud {
    position: relative;
    width: 130px;
    height: 60px;
    background: #fdfdfd;
    border-radius: 60px;
    filter: drop-shadow(0 2px 2px rgba(60,80,100,.35));
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #fdfdfd;
    border-radius: 50%;
  }
  .cloud::before {
    width: 62px; height: 62px;
    top: -30px; left: 20px;
  }
  .cloud::after {
    width: 46px; height: 46px;
    top: -20px; right: 22px;
  }

  h1 {
    font-family: "Marck Script", cursive;
    font-size: 64px;
    color: #eef3f6;
    text-shadow: 2px 2px 0 rgba(70,90,110,.55), 0 0 8px rgba(50,70,90,.25);
    white-space: nowrap;
    letter-spacing: 2px;
  }

  /* ---------- Экраны ---------- */
  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 20px;
    min-height: 0;
  }
  .screen.hidden { display: none; }

  /* ---------- Главная ---------- */
  .label {
    font-size: 30px;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(40,60,90,.35);
  }

  .search-box {
    display: flex;
    background: rgba(23,64,124,.85);
    border-radius: 40px;
    padding: 6px;
    width: 560px;
    max-width: 90vw;
  }

  #region-input {
    flex: 1;
    border: none;
    outline: none;
    background: #ffffff;
    border-radius: 30px;
    font-size: 22px;
    padding: 12px 24px;
    color: #2a3f5f;
    font-family: inherit;
  }

  #search-btn {
    width: 78px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #search-btn svg {
    width: 38px;
    height: 38px;
    stroke: #cfe0f2;
    fill: none;
    stroke-width: 2.6;
    stroke-linecap: round;
    transition: stroke .15s;
  }
  #search-btn:hover svg { stroke: #ffffff; }

  #result {
    font-size: 28px;
    color: #ffffff;
    min-height: 40px;
  }

  /* ---------- Страница региона ---------- */
  #back-btn {
    align-self: flex-start;
    margin: 15px 0 0 25px;
    border: none;
    background: rgba(23,64,124,.85);
    color: #ffffff;
    font-family: inherit;
    font-size: 20px;
    padding: 10px 22px;
    border-radius: 30px;
    cursor: pointer;
    transition: background .15s;
  }
  #back-btn:hover { background: rgba(40,90,160,.9); }

  .region-title {
    font-size: 34px;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(40,60,90,.35);
  }

  #map-wrap {
    width: min(1100px, 92vw);
    flex: 1;
    min-height: 0;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(20,40,70,.35);
  }
  #map-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* ---------- Шестерёнка ---------- */
  .gear {
    position: fixed;
    right: 22px;
    bottom: 18px;
    width: 62px;
    height: 62px;
    cursor: pointer;
    opacity: .85;
    z-index: 10;
  }
  .gear:hover { opacity: 1; }
  .gear svg {
    width: 100%;
    height: 100%;
    fill: #2d4a7a;
    filter: drop-shadow(0 2px 3px rgba(20,40,70,.4));
  }
</style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="cloud"></div>
      <h1>КЛЁВый Прогноз</h1>
      <div class="cloud"></div>
    </div>
  </header>

  <!-- Главный экран -->
  <section class="screen" id="screen-main">
    <div class="label">Выберите регион:</div>

    <form class="search-box" id="search-form">
      <input type="text" id="region-input" placeholder="Например: Кемеровская область" autocomplete="off">
      <button type="submit" id="search-btn" aria-label="Найти">
        <svg viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <line x1="15.5" y1="15.5" x2="21" y2="21"/>
        </svg>
      </button>
    </form>

    <div id="result"></div>
  </section>

  <!-- Страница региона -->
  <section class="screen hidden" id="screen-region">
    <button id="back-btn">← Назад</button>
    <div class="region-title" id="region-title"></div>
    <div id="map-wrap">
      <iframe id="region-map" title="Карта водоёмов региона"></iframe>
    </div>
    <!-- Сюда потом добавим список водоёмов и прогноз клёва -->
    <div id="region-content"></div>
  </section>

  <div class="gear" title="Настройки">
    <svg viewBox="0 0 24 24">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
    </svg>
  </div>

<script>
  const form = document.getElementById("search-form");
  const input = document.getElementById("region-input");
  const result = document.getElementById("result");

  const screenMain = document.getElementById("screen-main");
  const screenRegion = document.getElementById("screen-region");
  const regionTitle = document.getElementById("region-title");
  const regionMap = document.getElementById("region-map");
  const backBtn = document.getElementById("back-btn");

  // Переход на страницу региона
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const query = input.value.trim();
    if (query === "") {
      result.textContent = "Введите название региона";
      return;
    }
    result.textContent = "";

    regionTitle.textContent = "Водоёмы: " + query;
    regionMap.src = "https://yandex.ru/map-widget/v1/?text=" +
      encodeURIComponent("водоёмы " + query) + "&z=7";

    screenMain.classList.add("hidden");
    screenRegion.classList.remove("hidden");
  });

  // Возврат на главную
  backBtn.addEventListener("click", function () {
    screenRegion.classList.add("hidden");
    screenMain.classList.remove("hidden");
    input.value = "";
    result.textContent = "";
    regionMap.src = "";
  });
</script>

</body>
</html>
